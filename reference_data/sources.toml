# Reference data for comparing the synthetic population (Gesyland)
# with empirical statistics. One table entry per CSV file in this folder.
#
# CSV format (one row per group):
#   state, state_name  only in *_by_state files; state = first two AGS digits (1-16)
#   group_min          lower bound of the group (inclusive)
#   group_max          upper bound of the group (inclusive); empty = open-ended (e.g. "5+")
#   count              number of units in the group: persons (household members,
#                      residents, employees) or institutions (schools),
#                      depending on the table
#
# Fields per table:
#   file                  CSV file in this folder
#   description           what the table contains
#   label                 short source name for captions (e.g. "Mikrozensus 2022")
#   publisher             data provider
#   table_id              provider's table code (e.g. GENESIS code)
#   url                   where the data was retrieved
#   reference_year        year the data refers to
#   retrieved             date of download (YYYY-MM-DD)
#   license               e.g. "dl-de/by-2-0"
#   attribution           required attribution text
#   used_in_construction  "yes" / "no" / "unknown": was this source used to build Gesyland?
#   placeholder           true while the CSV contains made-up data

